<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PUB AI — Log in</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot"></span> PUB AI</div>

    <div id="auth-error" class="error-box"></div>

    <form id="auth-form">
      <div class="field" id="pub-name-field" style="display:none">
        <label for="pub-name">Pub name</label>
        <input type="text" id="pub-name" placeholder="The Crown & Anchor" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@yourpub.com" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="••••••••" />
      </div>

      <button type="submit" id="auth-submit" class="btn-primary">Log in</button>
    </form>

    <a href="#" id="mode-toggle" class="mode-toggle">Need an account? Sign up</a>
  </div>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
